name: Scientific figure timeout repairs
on:
  push:
    branches: ['benchmark/science-84-20261128']
permissions:
  contents: read
concurrency:
  group: science-84-timeout-repairs
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        image: [03-banana, 08-banana, 13-banana, 09-banana, 03-gpt_v2, 06-gpt_v1, 04-gpt_v2, 09-gpt_v1, 13-real]
    steps:
      - name: Check out the benchmark branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare detector runtime
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code e265cbb0832b62af261511a5d2506d994fd35681 -- detect.py science_image core examples/science/paper-pairs.csv
          python3 -m venv "$RUNNER_TEMP/science-python"
          "$RUNNER_TEMP/science-python/bin/pip" install --disable-pip-version-check --prefer-binary Pillow==13.0.0 numpy==2.3.5
          mkdir -p "$RUNNER_TEMP/science-model"
          cd "$RUNNER_TEMP/science-model"
          qbase='https://huggingface.co/unsloth/Qwen3-VL-8B-Instruct-GGUF/resolve/b93a7ee713758252c555be4210c00540df954dc2'
          download() {
            curl -fsSL --retry 3 --retry-all-errors --max-time 1200 "$1" -o "$2" && echo "$3  $2" | sha256sum -c - && return 0
            curl -fsSL --retry 3 --retry-all-errors --max-time 1200 "$1?download=true" -o "$2"
            echo "$3  $2" | sha256sum -c -
          }
          download https://github.com/ggml-org/llama.cpp/releases/download/b8219/llama-b8219-bin-ubuntu-x64.tar.gz llama.tar.gz e3f2005b3afc270263f7faa869f5fc889c0d7de431d03aa074c903daa4848e81
          tar xzf llama.tar.gz
          download "$qbase/Qwen3-VL-8B-Instruct-Q4_K_M.gguf" qwen.gguf 108e7ff92b78eefd3db4741885104acba514255c11b617d3c7b197a5f46efe89 &
          weights_pid=$!
          download "$qbase/mmproj-F16.gguf" vision.gguf d406d03ebabefdef86a2c86bf0c1b65f9e046f7a81c218f25de4931b46a07fc4
          wait "$weights_pid"
      - name: Run original detector
        env:
          IMAGE_ID: ${{ matrix.image }}
        run: |
          set -eu
          "$RUNNER_TEMP/science-python/bin/python" - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.github/science-batch')
          import run
          key = os.environ['IMAGE_ID']
          assigned = run.assigned
          matches = [(s, t) for s in range(20) for t in assigned(s) if t[0]['id'] == key]
          assert len(matches) == 1
          shard, task = matches[0]
          run.assigned = lambda s: [task] if s == shard else []
          # Only extend the HTTP read timeout for this isolated CPU worker.
          path = Path('science_image/model.py')
          code = path.read_text()
          assert code.count('timeout=600)') == 1
          path.write_text(code.replace('timeout=600)', 'timeout=2400)'))
          sys.argv = ['run.py', str(shard)]
          run.main()
          status = json.loads(Path('batch-output/status.json').read_text())
          assert status == {key: 0}, status
          PY
      - name: Save results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: science-repair-${{ matrix.image }}-attempt-${{ github.run_attempt }}
          path: batch-output/
          retention-days: 7
          if-no-files-found: warn
